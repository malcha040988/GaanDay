const $ = (id) => document.getElementById(id);
const els = {
  eyebrow: $('eyebrow'), greeting: $('greeting'), dateChip: $('dateChip'),
  affirmationText: $('affirmationText'), refreshBtn: $('refreshBtn'),
  dayCount: $('dayCount')
};

function setGreeting(){
  const now = new Date();
  const h = now.getHours();
  els.eyebrow.textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  els.greeting.textContent = h < 12 ? 'Simulan natin nang tama' : h < 18 ? 'Kumusta ang araw mo?' : 'Kamusta, tapos na ba ang araw mo?';
  els.dateChip.textContent = now.toLocaleDateString('en-PH', {weekday:'short', month:'short', day:'numeric'});
}

function dailyIndex(){
  const d = new Date();
  const dayNum = Math.floor(d.getTime() / 86400000);
  return dayNum % AFFIRMATIONS.length;
}

function showAffirmation(text, animate){
  if(animate){
    els.affirmationText.classList.add('fade');
    setTimeout(() => {
      els.affirmationText.textContent = text;
      els.affirmationText.classList.remove('fade');
    }, 220);
  } else {
    els.affirmationText.textContent = text;
  }
}

let currentIdx = dailyIndex();

function init(){
  setGreeting();
  showAffirmation(AFFIRMATIONS[currentIdx], false);
}

els.refreshBtn.addEventListener('click', () => {
  els.refreshBtn.classList.add('spin');
  setTimeout(() => els.refreshBtn.classList.remove('spin'), 400);
  let next;
  do { next = Math.floor(Math.random() * AFFIRMATIONS.length); } while(next === currentIdx && AFFIRMATIONS.length > 1);
  currentIdx = next;
  showAffirmation(AFFIRMATIONS[next], true);
});

init();
})();
